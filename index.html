<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <!-- Preconnect to the auth + data hosts the app contacts on first paint
         so the TLS handshake overlaps with parsing rather than blocking it. -->
    <link rel="preconnect" href="https://www.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.googleapis.com" />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
    <!-- Hero/splash logo. WebP is ~20× smaller than the original PNG. -->
    <link rel="preload" as="image" href="/x247-logo.webp" type="image/webp" fetchpriority="high" />
    <title>Recall X247 — Neural OS v2.0</title>
    <script>
      (function() {
        var t = localStorage.getItem('recall-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <style>
      html, body { margin: 0; padding: 0; background: #0d0d0d; }
      #x247-splash {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 20px;
        background: #0d0d0d;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #x247-splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
      #x247-splash .x247-logo-wrap {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        opacity: 0;
        animation: x247-fadein 0.5s ease-out 0.1s forwards;
      }
      #x247-splash img {
        width: clamp(100px, 14vw, 160px);
        height: auto;
        aspect-ratio: 785 / 421;
        user-select: none;
        -webkit-user-drag: none;
      }
      #x247-splash .x247-text {
        font-family: 'Alegreya Sans SC', system-ui, sans-serif;
        font-size: clamp(28px, 5vw, 42px);
        font-weight: 800;
        letter-spacing: 0.05em;
        color: transparent;
        -webkit-text-stroke: 1.5px #ffffff;
        text-stroke: 1.5px #ffffff;
        position: relative;
        background: linear-gradient(90deg, #c5f82a, #7c3aed, #06b6d4, #c5f82a);
        background-size: 300% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        animation: x247-gradient 3s linear infinite;
      }
      @keyframes x247-fadein {
        to { opacity: 1; }
      }
      @keyframes x247-gradient {
        0% { background-position: 0% 50%; }
        100% { background-position: 300% 50%; }
      }
      @media (prefers-reduced-motion: reduce) {
        #x247-splash .x247-logo-wrap, #x247-splash .x247-text {
          animation: none; opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="x247-splash" aria-hidden="true">
      <div class="x247-logo-wrap">
        <img
          src="/x247-logo.webp"
          alt="x247 AI"
          width="785"
          height="421"
          decoding="async"
          fetchpriority="high"
        />
        <div class="x247-text">X247</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.hideSplash = function () {
        var s = document.getElementById('x247-splash');
        if (s && !s.classList.contains('hide')) {
          s.classList.add('hide');
          setTimeout(function () { s && s.parentNode && s.parentNode.removeChild(s); }, 500);
        }
      };
      // Absolute safety-net: hide after 8s no matter what
      setTimeout(window.hideSplash, 8000);
    </script>
  </body>
</html>
